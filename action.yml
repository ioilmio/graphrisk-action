
name: 'GraphRisk Security Scan'
description: 'Identify and mitigate vulnerabilities in your dependencies.'
author: 'GraphRisk'
inputs:
  api-key:
    description: 'GraphRisk API Key'
    required: true
  project-id:
    description: 'Optional Project ID (If omitted, repo URL via GITHUB_CONTEXT is used)'
    required: false
  ecosystem:
    description: 'Ecosystem to scan. Supported: npm, pip, pypi, poetry, pipenv, go, rubygems, bundler'
    required: false
    default: 'npm'
  timeout:
    description: 'Maximum time to wait for scan completion in seconds (default: 600 = 10 minutes)'
    required: false
    default: '600'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'shield'
  color: 'purple'